<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studio Verandah — Office Interior Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --charcoal:#1F1D1B;
    --limestone:#EDE7DD;
    --clay:#B5763F;
    --graphite:#565049;
    --paper:#FAF8F4;
    --line: rgba(31,29,27,0.14);
    --sky:#DCEFFA;
    --sky-ink:#244E65;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth; scroll-padding-top: env(safe-area-inset-top,0px);}
  body{
    background:var(--paper);
    color:var(--charcoal);
    font-family:'Inter', system-ui, sans-serif;
    line-height:1.55;
    padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
  }
  h1,h2,h3{font-family:'Fraunces', Georgia, serif; font-weight:500; letter-spacing:-0.01em;}
  a{color:inherit;}
  .wrap{max-width:1120px; margin:0 auto; padding:0 28px;}

  header{
    position:sticky; top:0; z-index:10;
    background:rgba(250,248,244,0.9); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
    padding-top: env(safe-area-inset-top,0px);
  }
  nav{display:flex; align-items:center; justify-content:space-between; padding:18px 28px; max-width:1120px; margin:0 auto;}
  .brand{font-family:'Fraunces', serif; font-size:1.15rem; font-weight:600;}
  .navlinks{display:flex; gap:28px; font-size:0.92rem;}
  .navlinks a{text-decoration:none; opacity:0.75;}
  .navlinks a:hover{opacity:1;}
  .account-trigger{
    width:42px; height:42px; padding:0; display:grid; place-items:center; flex:0 0 auto;
    border:1px solid var(--line); border-radius:50%; background:transparent; color:var(--charcoal);
  }
  .account-trigger:hover{background:var(--limestone);}
  .account-trigger svg{width:20px; height:20px;}
  .account-backdrop{
    position:fixed; inset:0; z-index:20; display:grid; place-items:center; padding:20px;
    background:rgba(31,29,27,0.55);
  }
  .account-backdrop[hidden]{display:none;}
  .account-panel{
    width:min(100%, 440px); max-height:calc(100vh - 40px); overflow:auto;
    padding:30px; background:var(--paper); box-shadow:0 20px 60px rgba(0,0,0,0.2);
  }
  .account-panel h2{font-size:1.8rem; margin:0 36px 8px 0;}
  .account-panel > p{margin-bottom:22px; color:var(--graphite); font-size:0.92rem;}
  .account-panel form{gap:12px;}
  .account-panel label{font-size:0.85rem; font-weight:500;}
  .account-panel input{width:100%; margin-top:5px;}
  .account-panel form button{width:100%; align-self:stretch; margin-top:5px;}
  .account-panel [hidden]{display:none;}
  .account-top{display:flex; justify-content:space-between; align-items:flex-start;}
  .account-close{width:36px; height:36px; padding:0; display:grid; place-items:center; background:transparent; color:var(--charcoal); font-size:1.4rem;}
  .account-close:hover{background:var(--limestone);}
  .account-switch{margin-top:18px; font-size:0.9rem; color:var(--graphite);}
  .account-switch button{padding:0; border:0; background:none; color:var(--clay); font:inherit; text-decoration:underline; cursor:pointer;}
  .account-status{min-height:1.5em; margin-top:14px; color:var(--graphite); font-size:0.88rem;}
  [hidden]{display:none !important;}

  .hero{
    padding:100px 28px 90px;
    max-width:1120px; margin:0 auto;
    display:grid; grid-template-columns:1.3fr 1fr; gap:60px; align-items:end;
  }
  .hero h1{font-size:clamp(2.3rem,5vw,3.6rem); line-height:1.08; max-width:14ch;}
  .hero p{margin-top:22px; max-width:38ch; color:var(--graphite); font-size:1.05rem;}
  .hero .meta{border-left:2px solid var(--clay); padding-left:18px; color:var(--graphite); font-size:0.95rem;}
  .hero .meta div{margin-bottom:10px;}
  .cta{
    display:inline-block; margin-top:28px; padding:13px 26px;
    background:var(--charcoal); color:var(--paper); text-decoration:none;
    font-size:0.92rem; letter-spacing:0.01em;
  }
  .cta:hover{background:var(--clay);}

  section{padding:70px 28px;}
  section h2{font-size:1.8rem; margin-bottom:36px;}

  .requirements{background:#F3F7F8; border-top:1px solid var(--line); border-bottom:1px solid var(--line);}
  .requirements-inner{max-width:1120px; margin:0 auto;}
  .requirements-heading{display:flex; justify-content:space-between; align-items:center; gap:20px; margin-bottom:24px;}
  .requirements-heading h2{margin:0;}
  .add-requirement{
    align-self:auto; padding:12px 18px; background:var(--sky); color:var(--sky-ink);
    font-weight:600; border:1px solid #B8D8E9; border-radius:4px;
  }
  .add-requirement:hover{background:#C7E4F3;}
  .requirement-form{
    display:grid; grid-template-columns:repeat(3,1fr) auto; align-items:end; gap:14px;
    margin:0 0 24px; padding:20px; background:var(--paper); border:1px solid var(--line);
  }
  .requirement-form[hidden]{display:none;}
  .requirement-form label{display:flex; flex-direction:column; gap:7px; font-size:0.84rem; font-weight:600;}
  .requirement-form select{width:100%; min-height:46px; padding:10px 12px; border:1px solid var(--line); background:white; color:var(--charcoal); font:inherit;}
  .requirement-form button{align-self:end; min-height:46px; padding:10px 18px; background:var(--charcoal); color:var(--paper);}
  .requirement-list{display:grid; gap:10px;}
  .requirement-empty{padding:24px; color:var(--graphite); text-align:center; border:1px dashed rgba(31,29,27,0.24);}
  .requirement-item{display:flex; justify-content:space-between; align-items:center; gap:18px; padding:16px 18px; background:var(--paper); border:1px solid var(--line);}
  .requirement-item h3{font-size:1.05rem;}
  .requirement-item p{margin-top:3px; color:var(--graphite); font-size:0.9rem;}
  .requirement-remove{align-self:auto; padding:8px 12px; background:transparent; color:var(--graphite); border:1px solid var(--line); font-size:0.82rem;}
  .requirement-remove:hover{background:var(--limestone);}

  .services{background:var(--limestone); border-top:1px solid var(--line); border-bottom:1px solid var(--line);}
  .service-list{max-width:1120px; margin:0 auto;}
  .service-row{
    display:grid; grid-template-columns:80px 1fr 2fr; gap:24px;
    padding:26px 0; border-top:1px solid var(--line);
    align-items:baseline;
  }
  .service-row:last-child{border-bottom:1px solid var(--line);}
  .service-row .num{font-family:'Fraunces', serif; color:var(--clay); font-size:1rem;}
  .service-row h3{font-size:1.15rem; font-weight:500;}
  .service-row p{color:var(--graphite); font-size:0.96rem; max-width:52ch;}

  .work{max-width:1120px; margin:0 auto;}
  .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:4px;}
  .tile{
    aspect-ratio:4/3; background:var(--limestone);
    display:flex; align-items:flex-end; padding:16px;
    position:relative; overflow:hidden;
  }
  .tile::before{
    content:""; position:absolute; inset:0;
    background:linear-gradient(160deg, var(--charcoal) 0%, var(--graphite) 55%, var(--clay) 130%);
    opacity:0.9;
  }
  .tile span{position:relative; color:var(--paper); font-size:0.88rem; z-index:1;}
  .tile:nth-child(2)::before{background:linear-gradient(200deg, var(--graphite), var(--charcoal) 70%);}
  .tile:nth-child(3)::before{background:linear-gradient(140deg, var(--clay), var(--charcoal) 120%);}
  .tile:nth-child(4)::before{background:linear-gradient(180deg, var(--charcoal), var(--graphite));}
  .tile:nth-child(5)::before{background:linear-gradient(120deg, var(--graphite), var(--clay) 140%);}
  .tile:nth-child(6)::before{background:linear-gradient(200deg, var(--charcoal), var(--clay) 160%);}

  .about{background:var(--charcoal); color:var(--paper);}
  .about .wrap{display:grid; grid-template-columns:1fr 1fr; gap:60px; align-items:start;}
  .about h2{color:var(--paper);}
  .about p{color:rgba(250,248,244,0.75); font-size:1.02rem; max-width:46ch;}
  .stat-row{display:flex; gap:40px; margin-top:30px;}
  .stat-row div strong{display:block; font-family:'Fraunces', serif; font-size:1.7rem;}
  .stat-row div span{font-size:0.85rem; color:rgba(250,248,244,0.6);}

  .contact{max-width:1120px; margin:0 auto;}
  .contact-grid{display:grid; grid-template-columns:1fr 1fr; gap:60px;}
  .contact p{color:var(--graphite); max-width:40ch; margin-bottom:24px;}
  .contact-detail{margin-bottom:14px; font-size:0.98rem;}
  .contact-detail strong{display:block; font-size:0.8rem; color:var(--graphite); font-weight:500; margin-bottom:2px;}
  form{display:flex; flex-direction:column; gap:14px;}
  input, textarea{
    border:1px solid var(--line); background:var(--paper);
    padding:12px 14px; font-family:inherit; font-size:0.95rem; color:var(--charcoal);
  }
  textarea{resize:vertical; min-height:100px;}
  button{
    align-self:flex-start; padding:13px 26px; background:var(--charcoal); color:var(--paper);
    border:none; font-family:inherit; font-size:0.92rem; cursor:pointer;
  }
  button:hover{background:var(--clay);}

  footer{border-top:1px solid var(--line); padding:26px 28px; font-size:0.85rem; color:var(--graphite);
    padding-bottom: calc(26px + env(safe-area-inset-bottom,0px));}
  footer .wrap{display:flex; justify-content:space-between;}

  @media (max-width:760px){
    .hero{grid-template-columns:1fr; gap:30px; padding-top:60px;}
    .service-row{grid-template-columns:40px 1fr; }
    .service-row p{grid-column:2;}
    .grid{grid-template-columns:repeat(2,1fr);}
    .about .wrap, .contact-grid{grid-template-columns:1fr;}
    .navlinks{gap:16px; font-size:0.85rem;}
    nav{gap:14px; padding-left:18px; padding-right:18px;}
    .navlinks{gap:12px;}
    .account-panel{padding:24px;}
    .requirement-form{grid-template-columns:1fr 1fr;}
    .requirement-form label:last-of-type{grid-column:1;}
  }
  @media (max-width:480px){
    .brand{font-size:1rem; white-space:nowrap;}
    nav{flex-wrap:wrap;}
    .navlinks{order:1; flex:1 0 100%; justify-content:space-between; gap:8px; font-size:0.78rem;}
    .account-trigger{width:38px; height:38px;}
    .requirements-heading{align-items:flex-start; flex-direction:column;}
    .requirement-form{grid-template-columns:1fr; padding:16px;}
    .requirement-form label:last-of-type{grid-column:auto;}
    .requirement-form button{width:100%;}
    .requirement-item{align-items:flex-start;}
  }
</style>
</head>
<body>

<header>
  <nav>
    <div class="brand">Studio Verandah</div>
    <div class="navlinks">
      <a href="#requirements">Requirements</a>
      <a href="#services">Services</a>
      <a href="#work">Work</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </div>
    <button class="account-trigger" id="account-open" type="button" aria-label="Open account options" aria-haspopup="dialog" aria-controls="account-dialog">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="8" r="3.5"></circle>
        <path d="M5 20c.7-3.1 3.3-5 7-5s6.3 1.9 7 5"></path>
      </svg>
    </button>
  </nav>
</header>

<!-- include:account-creation --><!-- include:start-project --><!-- include:services --><!-- include:work --><!-- include:about --><!-- include:contact --><footer>
  <div class="wrap">
    <span>© 2026 Studio Verandah</span>
    <span>Bengaluru, India</span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://YOUR_PROJECT_REF.supabase.co';
  const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
  const accountDialog = document.getElementById('account-dialog');
  const accountTitle = document.getElementById('account-title');
  const accountDescription = document.getElementById('account-description');
  const accountSwitch = document.getElementById('account-switch');
  const accountStatus = document.getElementById('account-status');
  const loginForm = document.getElementById('login-form');
  const signupForm = document.getElementById('signup-form');
  const signupDetails = document.getElementById('signup-details');
  const signupVerification = document.getElementById('signup-verification');
  const contactForm = document.getElementById('contact-form');
  const contactDetails = document.getElementById('contact-details');
  const contactVerification = document.getElementById('contact-verification');
  const contactStatus = document.getElementById('contact-status');
  const accountOpen = document.getElementById('account-open');
  let pendingSignup = null;
  let pendingContact = null;

  function hasSupabaseConfig() {
    return SUPABASE_URL.startsWith('https://') && !SUPABASE_URL.includes('YOUR_PROJECT_REF') &&
      SUPABASE_ANON_KEY && !SUPABASE_ANON_KEY.includes('YOUR_SUPABASE_ANON_KEY');
  }

  function getSupabaseClient() {
    if (!hasSupabaseConfig()) {
      throw new Error('OTP is not configured yet. Add your Supabase project URL and anon key to this page.');
    }
    if (!window.supabase?.createClient) throw new Error('The authentication service could not be loaded. Please try again.');
    return window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }

  function contactIdentity(value) {
    const trimmed = value.trim();
    if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(trimmed)) return { email: trimmed };
    if (/^\+[1-9]\d{7,14}$/.test(trimmed)) return { phone: trimmed };
    throw new Error('Enter a valid email address or phone number with country code, such as +14155552671.');
  }

  async function edgeFunction(name, body) {
    if (!hasSupabaseConfig()) {
      throw new Error('OTP is not configured yet. Add your Supabase project URL and anon key to this page.');
    }
    const response = await fetch(`${SUPABASE_URL}/functions/v1/${name}`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`
      },
      body: JSON.stringify(body)
    });
    const result = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(result.message || result.error || 'The request could not be completed.');
    return result;
  }

  function setAccountMode(mode) {
    const isSignup = mode === 'signup';
    loginForm.hidden = isSignup;
    signupForm.hidden = !isSignup;
    accountTitle.textContent = isSignup ? 'Create your account' : 'Welcome back';
    accountDescription.textContent = isSignup
      ? 'Create an account to stay connected with Studio Verandah.'
      : 'Sign in to access your Studio Verandah account.';
    accountSwitch.innerHTML = isSignup
      ? 'Already have an account? <button type="button" id="show-login">Log in</button>'
      : 'New to Studio Verandah? <button type="button" id="show-signup">Create an account</button>';
    accountStatus.textContent = '';
    pendingSignup = null;
    signupForm.reset();
    document.getElementById('signup-code').required = false;
    signupDetails.hidden = false;
    signupVerification.hidden = true;
  }

  accountOpen.addEventListener('click', () => {
    setAccountMode('login');
    accountDialog.hidden = false;
    document.getElementById('login-form').querySelector('input').focus();
  });

  document.getElementById('account-close').addEventListener('click', () => {
    accountDialog.hidden = true;
    accountOpen.focus();
  });

  accountSwitch.addEventListener('click', (event) => {
    if (event.target.id === 'show-signup') setAccountMode('signup');
    if (event.target.id === 'show-login') setAccountMode('login');
  });

  accountDialog.addEventListener('click', (event) => {
    if (event.target === accountDialog) {
      accountDialog.hidden = true;
      accountOpen.focus();
    }
  });

  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && !accountDialog.hidden) {
      accountDialog.hidden = true;
      accountOpen.focus();
    }
  });

  loginForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    const formData = new FormData(loginForm);
    accountStatus.textContent = 'Signing in...';
    try {
      const identity = contactIdentity(formData.get('contact'));
      const { data, error } = await getSupabaseClient().auth.signInWithPassword({
        ...identity, password: formData.get('password')
      });
      if (error) throw error;
      accountStatus.textContent = `Signed in${data.user?.email ? ` as ${data.user.email}` : ''}.`;
    } catch (error) {
      accountStatus.textContent = error.message;
    }
  });

  signupForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    const formData = new FormData(signupForm);
    accountStatus.textContent = 'Sending verification code...';
    try {
      const identity = contactIdentity(formData.get('contact'));
      const { error } = await getSupabaseClient().auth.signUp({
        ...identity,
        password: formData.get('password'),
        options: { data: { full_name: formData.get('name') } }
      });
      if (error) throw error;
      pendingSignup = identity;
      signupDetails.hidden = true;
      signupVerification.hidden = false;
      document.getElementById('signup-code').required = true;
      accountStatus.textContent = `A verification code was sent to your ${identity.email ? 'email' : 'phone'}.`;
      document.getElementById('signup-code').focus();
    } catch (error) {
      accountStatus.textContent = error.message;
    }
  });

  document.getElementById('verify-signup').addEventListener('click', async () => {
    const token = document.getElementById('signup-code').value.trim();
    if (!pendingSignup || !/^\d{6}$/.test(token)) {
      accountStatus.textContent = 'Enter the 6-digit verification code.';
      return;
    }
    accountStatus.textContent = 'Verifying code...';
    try {
      const { error } = await getSupabaseClient().auth.verifyOtp({
        ...pendingSignup, token, type: pendingSignup.email ? 'signup' : 'sms'
      });
      if (error) throw error;
      accountStatus.textContent = 'Your account is verified and signed in.';
      signupForm.reset();
      document.getElementById('signup-code').required = false;
      pendingSignup = null;
      signupDetails.hidden = false;
      signupVerification.hidden = true;
    } catch (error) {
      accountStatus.textContent = error.message;
    }
  });

  contactForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    const formData = new FormData(contactForm);
    contactStatus.textContent = 'Sending verification code...';
    try {
      const identity = contactIdentity(formData.get('contact'));
      pendingContact = {
        ...identity,
        name: formData.get('name').trim(),
        company: formData.get('company').trim(),
        project: formData.get('project').trim()
      };
      await edgeFunction('contact-otp', { action: 'send', ...pendingContact });
      contactDetails.hidden = true;
      contactVerification.hidden = false;
      document.getElementById('contact-code').required = true;
      contactStatus.textContent = `A verification code was sent to your ${identity.email ? 'email' : 'phone'}.`;
      document.getElementById('contact-code').focus();
    } catch (error) {
      contactStatus.textContent = error.message;
    }
  });

  document.getElementById('verify-contact').addEventListener('click', async () => {
    const token = document.getElementById('contact-code').value.trim();
    if (!pendingContact || !/^\d{6}$/.test(token)) {
      contactStatus.textContent = 'Enter the 6-digit verification code.';
      return;
    }
    contactStatus.textContent = 'Verifying code...';
    try {
      const verification = await edgeFunction('contact-otp', {
        action: 'verify', ...contactIdentity(pendingContact.email || pendingContact.phone), token
      });
      await edgeFunction('contact-submit', { ...pendingContact, verificationToken: verification.verificationToken });
      contactForm.reset();
      document.getElementById('contact-code').required = false;
      pendingContact = null;
      contactDetails.hidden = false;
      contactVerification.hidden = true;
      contactStatus.textContent = 'Thanks. Your verified request has been sent.';
    } catch (error) {
      contactStatus.textContent = error.message;
    }
  });

  const requirementForm = document.getElementById('requirement-form');
  const requirementList = document.getElementById('requirement-list');
  const requirementToggle = document.getElementById('show-requirement-form');
  const requirementsStorageKey = 'studio-verandah-requirements';
  let requirements = [];

  try {
    requirements = JSON.parse(localStorage.getItem(requirementsStorageKey) || '[]');
    if (!Array.isArray(requirements)) requirements = [];
  } catch (error) {
    requirements = [];
  }

  function renderRequirements() {
    requirementList.replaceChildren();
    if (requirements.length === 0) {
      const emptyMessage = document.createElement('p');
      emptyMessage.className = 'requirement-empty';
      emptyMessage.textContent = 'No requirements added yet. Select “+ Add Requirement” to get started.';
      requirementList.append(emptyMessage);
      return;
    }

    requirements.forEach((requirement, index) => {
      const item = document.createElement('article');
      item.className = 'requirement-item';
      const details = document.createElement('div');
      const title = document.createElement('h3');
      title.textContent = requirement.placement;
      const description = document.createElement('p');
      description.textContent = `${requirement.material} · ${requirement.size}`;
      details.append(title, description);
      const removeButton = document.createElement('button');
      removeButton.className = 'requirement-remove';
      removeButton.type = 'button';
      removeButton.textContent = 'Remove';
      removeButton.setAttribute('aria-label', `Remove ${requirement.placement} requirement`);
      removeButton.addEventListener('click', () => {
        requirements.splice(index, 1);
        saveRequirements();
      });
      item.append(details, removeButton);
      requirementList.append(item);
    });
  }

  function saveRequirements() {
    try {
      localStorage.setItem(requirementsStorageKey, JSON.stringify(requirements));
    } catch (error) {
      // Keep the current list usable if browser storage is unavailable.
    }
    renderRequirements();
  }

  requirementToggle.addEventListener('click', () => {
    requirementForm.hidden = !requirementForm.hidden;
    requirementToggle.setAttribute('aria-expanded', String(!requirementForm.hidden));
    if (!requirementForm.hidden) requirementForm.querySelector('select').focus();
  });

  requirementForm.addEventListener('submit', (event) => {
    event.preventDefault();
    const formData = new FormData(requirementForm);
    requirements.push({
      placement: formData.get('placement'),
      material: formData.get('material'),
      size: formData.get('size')
    });
    saveRequirements();
    requirementForm.reset();
    requirementForm.hidden = true;
    requirementToggle.setAttribute('aria-expanded', 'false');
    requirementToggle.focus();
  });

  renderRequirements();
</script>

</body>
</html>
