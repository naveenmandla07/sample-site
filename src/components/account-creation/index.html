<div class="account-backdrop" id="account-dialog" role="dialog" aria-modal="true" aria-labelledby="account-title" hidden>
  <div class="account-panel" role="document">
    <div class="account-top">
      <h2 id="account-title">Welcome back</h2>
      <button class="account-close" id="account-close" type="button" aria-label="Close account options">×</button>
    </div>
    <p id="account-description">Sign in to access your Studio Verandah account.</p>
    <form id="login-form">
      <label>Email or phone number<input type="text" name="contact" autocomplete="username" placeholder="name@example.com or +14155552671" required></label>
      <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
      <button type="submit">Log in</button>
    </form>
    <form id="signup-form" hidden>
      <div id="signup-details">
        <label>Full name<input type="text" name="name" autocomplete="name" required></label>
        <label>Email or phone number<input type="text" name="contact" autocomplete="username" placeholder="name@example.com or +14155552671" required></label>
        <label>Password<input type="password" name="password" autocomplete="new-password" minlength="8" required></label>
        <button type="submit">Create account</button>
      </div>
      <div id="signup-verification" hidden>
        <label for="signup-code">Verification code</label>
        <input id="signup-code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="6-digit code">
        <button type="button" id="verify-signup">Verify and create account</button>
      </div>
    </form>
    <p class="account-switch" id="account-switch">New to Studio Verandah? <button type="button" id="show-signup">Create an account</button></p>
    <p class="account-status" id="account-status" role="status" aria-live="polite"></p>
  </div>
</div>
